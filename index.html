<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>私有主页 · 请登录</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="private.css">
<script type="module" src="app.js"></script>
</head>
<body class="ttd-locked">
<div id="ttd-auth" class="ttd-auth">
<form id="ttd-login" class="ttd-auth-card">
<div class="ttd-eyebrow">PRIVATE HOMEPAGE</div><h1>登录后访问主页</h1>
<p>主页内容仅对绑定账号开放。请在不同设备上使用同一个账号登录，查看和更新云端内容。</p>
<label for="ttd-email">邮箱</label><input id="ttd-email" type="email" autocomplete="username" required>
<label for="ttd-password">密码</label><input id="ttd-password" type="password" autocomplete="current-password" required>
<button id="ttd-login-submit" type="submit">登录</button>
<p id="ttd-login-status" role="status" aria-live="polite">请使用现有云端账号；本站不开放注册。</p>
</form>
</div>
<div id="site-root" hidden></div>
<div id="ttd-toolbar" class="ttd-toolbar" hidden aria-label="主页管理">
<span id="ttd-sync" role="status" aria-live="polite">云端已连接</span>
<button id="ttd-edit-toggle" type="button" aria-pressed="false">编辑内容</button>
<button id="ttd-add" type="button">新增内容</button>
<button id="ttd-page-title" type="button">网页标题</button>
<button id="ttd-settings-open" type="button">翻译设置</button>
<button id="ttd-refresh" type="button">刷新</button>
<button id="ttd-logout" type="button">退出</button>
</div>
<dialog id="ttd-editor" class="ttd-dialog" aria-labelledby="ttd-editor-title">
<form id="ttd-editor-form">
<div class="ttd-dialog-head"><h2 id="ttd-editor-title">编辑内容</h2><button type="button" data-close="ttd-editor" aria-label="关闭编辑窗口">×</button></div>
<div id="ttd-add-options" hidden>
<label for="ttd-target">所属栏目</label><select id="ttd-target"></select>
<div class="ttd-columns"><div><label for="ttd-kind">内容类型</label><select id="ttd-kind"><option value="paragraph">正文 / 论文 / 课题 / 课程</option><option value="heading">分组标题 / 年份</option><option value="review">同行评审期刊</option><option value="card">新卡片 / 课程分类</option><option value="section">新一级栏目（自动加入导航）</option></select></div><div><label for="ttd-placement">插入位置</label><select id="ttd-placement"><option value="end">本组末尾</option><option value="start">本组开头</option></select></div></div>
</div>
<div class="ttd-format" aria-label="文字格式"><span>格式：</span><button type="button" data-format="bold"><b>加粗</b></button><button type="button" data-format="italic"><i>斜体</i></button><button type="button" data-format="createLink">链接</button><button type="button" data-format="removeFormat">清除格式</button></div>
<label id="ttd-zh-label" for="ttd-zh">中文 / 原文</label><div id="ttd-zh" class="ttd-rich" contenteditable="true" role="textbox" aria-multiline="true" aria-labelledby="ttd-zh-label"></div>
<label class="ttd-check"><input id="ttd-auto-en" type="checkbox" checked>中文变化时自动更新英文（手动修改的英文优先保留）</label>
<label id="ttd-en-label" for="ttd-en">英文</label><div id="ttd-en" class="ttd-rich ttd-english-editor" contenteditable="true" role="textbox" aria-multiline="true" aria-labelledby="ttd-en-label"></div>
<p class="ttd-help">纯英文文献、年份、邮箱、DOI 不会被重复翻译。可直接编辑英文；不需要双语的内容可取消勾选。</p>
<p id="ttd-editor-status" class="ttd-message" role="status" aria-live="polite"></p>
<div class="ttd-dialog-actions"><button id="ttd-delete" type="button" class="ttd-danger">删除本条</button><button id="ttd-up" type="button">上移</button><button id="ttd-down" type="button">下移</button><button id="ttd-zh-only" type="button" hidden>仅保存原文，英文待更新</button><button type="button" data-close="ttd-editor">取消</button><button id="ttd-save" type="submit" class="ttd-primary">保存并同步</button></div>
</form>
</dialog>
<dialog id="ttd-settings" class="ttd-dialog" aria-labelledby="ttd-settings-title">
<form id="ttd-settings-form"><div class="ttd-dialog-head"><h2 id="ttd-settings-title">英文自动更新</h2><button type="button" data-close="ttd-settings" aria-label="关闭翻译设置">×</button></div>
<p>支持浏览器本地翻译的电脑可直接使用。手机及其他浏览器需配置云端翻译；保存一次后，同一账号的设备共用配置。</p>
<p>启用云端翻译后，仅待翻译的文字会发送到所选服务。API 密钥在服务端加密保存，不写入 GitHub，也不会返回浏览器。调用费用由对应服务按你的账号计收。</p>
<label for="ttd-provider">云端翻译服务</label><select id="ttd-provider"><option value="deepseek">DeepSeek · deepseek-flash</option><option value="openai">OpenAI · gpt-4o-mini</option></select>
<label for="ttd-api-key">API 密钥（留空不修改；更换服务时请填写对应密钥）</label><input id="ttd-api-key" type="password" autocomplete="off" spellcheck="false">
<p id="ttd-settings-status" class="ttd-message" role="status" aria-live="polite"></p>
<div class="ttd-dialog-actions"><button id="ttd-local-translation" type="button">启用本机翻译</button><button id="ttd-clear-key" type="button" class="ttd-danger">删除云端密钥</button><button type="button" data-close="ttd-settings">关闭</button><button id="ttd-settings-save" type="submit" class="ttd-primary">保存配置</button></div>
</form></dialog>
<noscript><p class="ttd-nojs">请启用 JavaScript 后登录。未登录时不会加载任何主页正文。</p></noscript>
</body>
</html>
